x-runtime: &runtime
  env_file: .env
  environment: &environment
    SCALE: ${SCALE:-full}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    API_URL: http://api-server:8000
    PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    HF_HOME: /app/.cache/huggingface
    PYTHONHASHSEED: "42"
    TOKENIZERS_PARALLELISM: "false"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    SERVING_THREADS: ${SERVING_THREADS:-2}
    SERVING_PARALLEL_HYBRID: ${SERVING_PARALLEL_HYBRID:-1}
    SERVING_OPTIMIZE_VISION: ${SERVING_OPTIMIZE_VISION:-1}
    SERVING_GC_FREEZE: ${SERVING_GC_FREEZE:-1}
    PREPARE_TIMEOUT_SECONDS: ${PREPARE_TIMEOUT_SECONDS:-21600}
    READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-21600}
    DOCKER_RUNTIME: "1"
    MM_LOG_FORMAT: ${MM_LOG_FORMAT:-compact}
    RUNTIME_RESULTS_DIR: ${RUNTIME_RESULTS_DIR:-docs/results/docker/runtime-illustrations-v1}
  volumes:
    - ./data:/app/data
    - ./models:/app/models
    - ./docs/results:/app/docs/results
    - hf_cache:/app/.cache/huggingface

services:
  redis:
    image: redis:7
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --loglevel warning
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-server:
    <<: *runtime
    build: {context: ., dockerfile: docker/Dockerfile.api}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 4g
    cpus: 4
    init: true

  dashboard:
    build: {context: ., dockerfile: docker/Dockerfile.dashboard}
    env_file: .env
    environment:
      SCALE: ${SCALE:-full}
      API_URL: http://api-server:8000
      PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      PUBLIC_DASHBOARD_URL: http://localhost:${DASHBOARD_PORT:-8501}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-21600}
      RESULTS_DIR: ${RUNTIME_RESULTS_DIR:-docs/results/docker/runtime-illustrations-v1}/${SCALE:-full}
      MM_LOG_FORMAT: ${MM_LOG_FORMAT:-compact}
    ports: ["127.0.0.1:${DASHBOARD_PORT:-8501}:8501"]
    depends_on:
      api-server: {condition: service_healthy}
    volumes: ["./docs/results:/app/docs/results:ro", "./data:/app/data:ro", "./models:/app/models:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: ${READY_TIMEOUT_SECONDS:-21600}s
    mem_limit: 512m

  simulator:
    <<: *runtime
    build: {context: ., dockerfile: docker/Dockerfile.api}
    command: ["python", "-m", "docker.simulator"]
    network_mode: service:api-server
    environment:
      <<: *environment
      API_URL: http://127.0.0.1:8000
      CT_AUTO_TRAIN: ${CT_AUTO_TRAIN:-1}
      SIMULATOR_BATCH_SIZE: ${SIMULATOR_BATCH_SIZE:-100}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-5}
      SIMULATOR_ATTRIBUTED_VISITS: ${SIMULATOR_ATTRIBUTED_VISITS:-1}
    depends_on:
      redis: {condition: service_healthy}
      api-server: {condition: service_healthy}
      dashboard: {condition: service_healthy}
    init: true
    mem_limit: 4g
    cpus: 4

  storefront:
    profiles: [storefront]
    build: {context: ., dockerfile: docker/Dockerfile.storefront}
    environment:
      API_URL: http://api-server:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:${STOREFRONT_PORT:-3000}:3000"]
    depends_on:
      api-server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/live/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    init: true

volumes:
  hf_cache:
  redis_data:
